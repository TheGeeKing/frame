name: CI and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug

  release:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      RELEASE_KEYSTORE: ${{ github.workspace }}/release.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created == 'true'
      - uses: actions/setup-java@v4
        if: steps.release.outputs.release_created == 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        if: steps.release.outputs.release_created == 'true'
      - if: steps.release.outputs.release_created == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
      - if: steps.release.outputs.release_created == 'true'
        run: ./gradlew bundleRelease
      - if: steps.release.outputs.release_created == 'true'
        run: ./gradlew assembleRelease -PabiSplits=true
      - if: steps.release.outputs.release_created == 'true'
        run: gh release upload "${{ steps.release.outputs.tag_name }}" app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab
